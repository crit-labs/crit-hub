name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Engine folders match their cards
        run: python -B tools/check_engines.py
