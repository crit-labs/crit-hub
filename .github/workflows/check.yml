name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML and jsonschema
        run: python -m pip install pyyaml==6.0.3 jsonschema==4.26.0
      - name: Engine folders match their cards
        run: python -B tools/check_engines.py

  # Once the registry passes on main, rebuild the website (crit-hub-web on Cloudflare Pages) from it.
  # Without the deploy hook secret, as in forks, there is nothing to rebuild.
  site:
    needs: registry
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the website
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null; fi
