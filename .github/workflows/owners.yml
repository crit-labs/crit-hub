name: owners

# A change to engines/<owner>/ needs <owner>'s approval (tools/check_owners.py). It runs again on
# every review, so an approval turns the check green.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  engine-owners:
    runs-on: ubuntu-latest
    steps:
      # The base branch's check, never the pull request's own version of it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Engine contributors approved their folders
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B tools/check_owners.py --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
