readme:
  intro: |
    A 121-commit patch series on John Pezzulli's SGLang fork, plus ten FlashInfer patches, that takes
    single-request decoding of Qwen3.8-Flash-Next (NVFP4) on one RTX PRO 6000 Blackwell Max-Q from about
    130-210 tok/s to 230-670 tok/s depending on the text. The repository holds the patches, launch
    scripts, benchmark harness, the stripped result files behind every number and the notes on what did
    not work. Please read and credit the base fork first.
  design: |
    | Part | How |
    | --- | --- |
    | Speculation | NEXTN (MTP) chains with a reduced 49,152-token draft vocabulary; widths 4, 16 and an adaptive policy (`wa`) switching between 3, 7 and 15 draft steps |
    | Dense weights | Weight-only FP8 through a Triton W8A16 GEMV tuned per shape (dense layers, lm_heads, MTP layer) |
    | Kernels | Fused KV-FP8 store, hyper-connection mix in three kernels, fused norms; ~3,175 down to ~2,100 kernels per step at W16 |
    | MoE | Six FlashInfer CUTLASS fused-MoE patches: one-kernel routing prologue for top-10 of 512 experts |
    | Pruning | In a verify batch, a route to an expert used by one row with weight < 0.08 is dropped (changes the model's computation; `PRUNE_TAU=0` turns it off) |
  measured: |
    Shipped build, 2026-10-06, 8 held-out prompts per workload, one request at a time, greedy, thinking
    on, 325 W, mean decode tok/s:

    | Build | code-edit | prose-en | prose-ja | agent-loop |
    | --- | ---: | ---: | ---: | ---: |
    | `wa`, public components only | 468 | 232 | 248 | 307 |
    | `w4`, public components only | 356 | 241 | 254 | 301 |
    | `wa`, private MTP head and token map | 584 | 253 | 290 | 359 |
    | Unmodified base fork (2026-09-02, other prompts) | 211 | 129 | 117 | 174 |

    The card's figures are the public-components row, the configuration anyone can run from the
    repository. The faster rows use a fine-tuned MTP head and token map built from the author's private
    data, which are not published.
  checks: |
    - **Pruning audit:** about 4,000 questions per arm (GSM8K, MMLU, HumanEval, JCommonsenseQA) and an
      18.5K-token needle test found no significant difference from the unpruned model (smallest p =
      0.362); non-inferiority at 0.5 pp was not established for GSM8K or HumanEval, and the audit ran with
      thinking off and up to two concurrent requests.
    - **Sampling:** a fix makes the speculative verify honour `min_p`.
  limits: |
    - The headline 595-671 tok/s figures need the private MTP head and token map; with public components
      `wa` is about 20% slower on code-edit and 8-15% slower elsewhere.
    - Workloads are narrow (code-edit is a repetitive mechanical edit) and most counted tokens are reasoning text.
    - Greedy is not bit-reproducible (atomic adds in the MoE finalize and split-K kernels).
    - Sized for one request at a time on a GPU that also runs a desktop; 524,288-token context is opt-in YaRN.
  build_and_chat: |
    ```sh
    git clone https://github.com/aiueo52/flash-next-rtxpro6000.git
    git -C flash-next-rtxpro6000 checkout e0fa9fa9fc3ccd710a8fb3d2639b85ce62188c23
    ```

    Clone the base fork at `16e5682aad`, run `patches/sglang/apply.sh`, build its venv, run
    `patches/flashinfer/apply.sh`, download `RadixArk/Qwen3.8-Flash-Next-NVFP4`, then
    `SGLANG_DIR=... TOKEN_MAP=tokenmaps/public/public_49152.pt launch/serve-fast.sh wa`; full steps in
    [docs/reproduce.md](https://github.com/aiueo52/flash-next-rtxpro6000/blob/e0fa9fa9fc3ccd710a8fb3d2639b85ce62188c23/docs/reproduce.md).
    Check the download with `python -B tools/verify_model.py <this engine folder> <model folder>`.
