# The quality modes a result can be judged in: how much output drift from the checkpoint the user
# selected the engine may trade for speed, never how that checkpoint is quantized or stored. Every
# mode measures perplexity and KL divergence against the same reference, the checkpoint's stored
# weights with exact activations. crit Eval records a run's mode in its result file (requirements.quality_mode), and every
# card's result states it as quality_mode: a result that states none, or a mode not listed here,
# fails tools/check_engines.py.
#
# This list is the only place crit-hub names modes: tools/check_engines.py accepts the modes listed
# here, and tools/card.py and the website show their label and summary, in this order. When crit Eval
# gains a mode, add it here; nothing else needs to change.
#
#   <id>:            as crit Eval records it, lowercase letters, digits and _
#     label:         how pages show it, a word or two
#     summary:       one line: what quality is judged against

preserve:
  label: preserve
  summary: drift from the checkpoint the user selected judged by a budget that keeps the output close to the checkpoint's
speed:
  label: speed
  summary: the mode for speed, drift from the checkpoint the user selected judged by a budget eight times preserve's, whatever format the checkpoint is stored in
